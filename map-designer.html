<title>FPS Map Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one full-height workspace. Top bar, then the map canvas, then the enemy tray + tool dock.
   Properties slide up over the bottom of the canvas when something is selected. */
:root {
  --bg: #e4e9ee;
  --surface: #fbfcfd;
  --surface-2: #eef2f5;
  --fg: #17212b;
  --muted: #5a6776;
  --line: #d2d9e1;
  --accent: #0d8a7c;
  --accent-fg: #ffffff;
  --accent-soft: #d4efea;
  --warn: #c98a0a;
  --danger: #d23c41;
  --grid-bg: #f4f6f8;
  --grid-minor: #e2e7ec;
  --grid-major: #c4cdd7;
  --enemy-ring: #ffffff;
  --is-dark: 0;
  --shadow: 0 6px 24px rgba(20, 32, 44, .14);
  --font-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1117; --surface: #141b23; --surface-2: #1b242e; --fg: #e3e9ef; --muted: #8b98a7; --line: #27323e;
    --accent: #2fc4ae; --accent-fg: #052520; --accent-soft: #11362f; --warn: #e3a52a; --danger: #f0575c;
    --grid-bg: #0f151b; --grid-minor: #18212a; --grid-major: #26313d; --enemy-ring: #0c1117; --is-dark: 1;
    --shadow: 0 6px 24px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1117; --surface: #141b23; --surface-2: #1b242e; --fg: #e3e9ef; --muted: #8b98a7; --line: #27323e;
  --accent: #2fc4ae; --accent-fg: #052520; --accent-soft: #11362f; --warn: #e3a52a; --danger: #f0575c;
  --grid-bg: #0f151b; --grid-minor: #18212a; --grid-major: #26313d; --enemy-ring: #0c1117; --is-dark: 1;
  --shadow: 0 6px 24px rgba(0, 0, 0, .45);
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font: 400 14px/1.4 var(--font-body);
  display: flex; flex-direction: column; overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

/* Top bar */
.top {
  flex: none; display: flex; align-items: center; gap: 8px;
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.mapbtn { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; background: none; border: 0; padding: 2px 0; text-align: left; }
.eyebrow { font: 600 10px/1.2 var(--font-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); display: flex; gap: 6px; align-items: center; white-space: nowrap; }
.eyebrow .tag { color: var(--warn); }
.mapname { font: 600 18px/1.2 var(--font-display); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 4px; }
.mapname svg { width: 16px; height: 16px; color: var(--muted); }
.status { display: flex; align-items: center; gap: 6px; background: none; border: 0; padding: 6px 4px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.status i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.status[data-state="ok"] i { background: var(--accent); }
.status[data-state="pending"] i { background: var(--warn); }
.status[data-state="err"] i { background: var(--danger); }
.iconbtn { width: 40px; height: 40px; flex: none; display: grid; place-items: center; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); }
.iconbtn:disabled { opacity: .35; cursor: default; }

/* Stage */
.stage { flex: 1; min-height: 0; position: relative; overflow: hidden; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
.floors {
  position: absolute; top: 12px; right: max(12px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; align-items: stretch; width: 92px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden;
}
.floors button { border: 0; background: none; display: grid; place-items: center; padding: 6px 4px; }
.floors button:disabled { opacity: .3; cursor: default; }
.floors .fname { border-block: 1px solid var(--line); padding: 6px 6px; gap: 1px; }
.floors .fname b { font: 600 12px/1.15 var(--font-display); letter-spacing: .06em; text-transform: uppercase; text-align: center; overflow-wrap: anywhere; }
.floors .fname small { font: 500 10px var(--font-mono); color: var(--muted); }
.hint {
  position: absolute; top: 12px; left: max(12px, env(safe-area-inset-left, 0px)); right: 116px; width: fit-content; max-width: calc(100% - 128px);
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 7px 11px;
  font-size: 12.5px; color: var(--fg); box-shadow: var(--shadow); pointer-events: none;
}
.scale {
  position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px; display: flex; align-items: center; gap: 6px;
  font: 500 11px var(--font-mono); color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px;
}
.scale .sq { width: 12px; height: 12px; border: 1.5px solid var(--muted); border-radius: 2px; }

/* Properties panel */
.panel {
  position: absolute; left: 8px; right: 8px; bottom: 8px; margin-inline: auto; max-width: 560px; max-height: 58%;
  overflow-y: auto; overscroll-behavior: contain;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
}
.panel-head { position: sticky; top: 0; z-index: 1; background: var(--surface); display: flex; align-items: center; gap: 8px; padding: 10px 10px 8px 14px; border-bottom: 1px solid var(--line); }
.panel-title { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.panel-title strong { font: 600 16px var(--font-display); }
.panel-title .dims { font-size: 12px; color: var(--muted); }
.panel-actions { display: flex; gap: 4px; }
.panel-actions button { width: 36px; height: 36px; display: grid; place-items: center; border: 0; border-radius: 9px; background: var(--surface-2); }
.panel-actions button.danger { color: var(--danger); }
.panel-actions button.armed { width: auto; padding: 0 10px; background: var(--danger); color: #fff; font-size: 12px; font-weight: 600; }
.panel-body { display: grid; gap: 12px; padding: 12px 14px 14px; }
.prow { display: grid; grid-template-columns: 62px 1fr; align-items: center; gap: 10px; }
.prow > .lbl { font: 600 11px var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.ctrl { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.ctrl input[type="range"] { flex: 1; min-width: 120px; accent-color: var(--accent); height: 28px; }
.ctrl output { min-width: 84px; font: 500 13px var(--font-mono); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { border: 0; background: none; padding: 7px 14px; font-weight: 500; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.stepper span { padding: 0 2px 0 9px; font: 600 11px var(--font-display); color: var(--muted); }
.stepper button { width: 32px; height: 34px; border: 0; background: var(--surface-2); font-size: 18px; line-height: 1; }
.stepper input, .num input { width: 56px; height: 34px; border: 0; background: none; color: var(--fg); text-align: center; font: 500 13px var(--font-mono); -moz-appearance: textfield; }
.num { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 9px; }
.num span { padding-left: 9px; font: 600 11px var(--font-display); color: var(--muted); }
.num input { width: 70px; }
input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.lockbtn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 9px; border: 1px solid var(--line); background: none; color: var(--muted); }
.lockbtn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); padding: 0; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent); }
.typechip { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px 5px 5px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 500; }
.typechip i { width: 20px; height: 20px; border-radius: 50%; }
.typechip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }

/* Dock */
.dock {
  flex: none; background: var(--surface); border-top: 1px solid var(--line);
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
  display: grid; gap: 6px;
}
.trayhead { display: flex; align-items: center; justify-content: space-between; }
.trayhead .eyebrow button { background: none; border: 0; color: var(--accent); font: inherit; letter-spacing: inherit; text-transform: inherit; padding: 4px 0 4px 8px; }
.tray { display: flex; gap: 8px; overflow-x: auto; touch-action: pan-x; scrollbar-width: none; padding: 2px 0 4px; }
.tray::-webkit-scrollbar { display: none; }
.chip {
  flex: none; display: flex; align-items: center; gap: 8px; padding: 5px 13px 5px 5px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface-2); font-weight: 500; touch-action: pan-x; user-select: none; -webkit-user-select: none;
}
.chip i { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 600 13px var(--font-display); font-style: normal; box-shadow: 0 0 0 2px var(--enemy-ring) inset; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.tools { display: flex; gap: 4px; }
.tool {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px; border: 0; border-radius: 10px; background: none; color: var(--muted);
  font: 600 10.5px var(--font-display); letter-spacing: .06em; text-transform: uppercase;
}
.tool[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.tool.sep { margin-left: 6px; }
.ghost { position: fixed; z-index: 50; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; box-shadow: 0 0 0 3px var(--enemy-ring), var(--shadow); pointer-events: none; display: grid; place-items: center; font: 600 15px var(--font-display); }

/* Sheets */
.backdrop { position: fixed; inset: 0; z-index: 40; background: rgba(8, 14, 20, .45); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 560px; max-height: 88%; overflow-y: auto; overscroll-behavior: contain;
  background: var(--surface); border-radius: 18px 18px 0 0; box-shadow: var(--shadow);
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.sheet-head { position: sticky; top: 0; z-index: 1; background: var(--surface); display: flex; align-items: center; justify-content: space-between; padding: 14px 0 10px; }
.sheet-head h2 { margin: 0; font: 600 20px var(--font-display); }
.sheet section { display: grid; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
.sheet h3 { margin: 0; font: 600 11px var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.sheet p { margin: 0; color: var(--muted); font-size: 13px; max-width: 60ch; }
.field { width: 100%; height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); padding: 0 12px; font: 500 15px var(--font-body); }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 13px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 500; }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-fg); }
.btn.danger { color: var(--danger); }
.btn.armed { background: var(--danger); color: #fff; border-color: transparent; }
.btn svg { width: 17px; height: 17px; }
.list { display: grid; gap: 6px; }
.lrow { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); min-width: 0; }
.lrow.current { border-color: var(--accent); }
.lrow .grow { flex: 1; min-width: 0; }
.lrow .open { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 2px 0; }
.lrow .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lrow .s { font-size: 12px; color: var(--muted); }
.lrow .field { height: 36px; }
.lrow .sw { width: 24px; height: 24px; }
.pill { font: 600 10px var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.toggle { display: flex; align-items: center; gap: 10px; font-weight: 500; }
.toggle input { width: 20px; height: 20px; accent-color: var(--accent); }
.toast {
  position: fixed; z-index: 60; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  max-width: min(92vw, 420px); background: var(--fg); color: var(--surface); padding: 10px 14px; border-radius: 10px; font-size: 13px; box-shadow: var(--shadow);
}
@media (prefers-reduced-motion: no-preference) {
  .panel, .sheet { animation: rise .16s ease-out; }
  @keyframes rise { from { transform: translateY(12px); opacity: .6; } to { transform: none; opacity: 1; } }
}
@media (min-width: 720px) {
  .tool { flex-direction: row; justify-content: center; gap: 8px; font-size: 11.5px; padding: 9px 6px; }
}
</style>

<header class="top">
  <button class="mapbtn" id="mapbtn" aria-label="Open maps menu">
    <span class="eyebrow">FPS Map Designer <span class="tag" id="sampletag" hidden>Example</span></span>
    <span class="mapname"><span id="mapname">Map</span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></span>
  </button>
  <button class="status" id="status" data-state="ok" aria-live="polite"><i></i><span id="statustext">Ready</span></button>
  <button class="iconbtn" id="undo" aria-label="Undo" disabled><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-4"/></svg></button>
  <button class="iconbtn" id="redo" aria-label="Redo" disabled><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h4"/></svg></button>
</header>

<main class="stage" id="stage">
  <canvas id="map" aria-label="Map canvas"></canvas>
  <div class="hint" id="hint" hidden></div>
  <div class="floors" id="floors">
    <button id="floorup" aria-label="Go up a floor"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
    <button class="fname" id="floorname" aria-label="Manage floors"><b id="floorlabel">Ground</b><small id="floorcount">1 / 1</small></button>
    <button id="floordown" aria-label="Go down a floor"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
  </div>
  <div class="scale" id="scale"><span class="sq"></span><span id="scaletext">= 1 m</span></div>
  <div class="panel" id="panel" hidden></div>
</main>

<footer class="dock">
  <div class="trayhead">
    <span class="eyebrow">Enemies · drag up onto the map</span>
    <span class="eyebrow"><button id="edittypes">Edit types</button></span>
  </div>
  <div class="tray" id="tray"></div>
  <div class="tools" id="tools">
    <button class="tool" data-tool="select" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-2 6z"/></svg>Select</button>
    <button class="tool" data-tool="circle" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-16 0a8 8 0 1 1 16 0z"/></svg>Circle</button>
    <button class="tool" data-tool="poly" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/></svg>Polygon</button>
    <button class="tool sep" id="snapbtn" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M4 12h16M12 4v16"/></svg>Snap</button>
    <button class="tool" id="fitbtn"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Fit</button>
  </div>
</footer>

<input type="file" id="importfile" accept=".json,application/json" hidden>

  await flushSave();
  const m = blankMap(name);
  openMap(m); await saveNow();
}
function buildMaps(body) {
  const dlOk = !!Store.dl;
  body.innerHTML = `
    <section style="border-top:0;padding-top:0">
      <h3>Current map</h3>
      <input class="field" id="m-name" maxlength="80" aria-label="Map name" value="${esc(map.name)}">
      <div class="btnrow">
        <button class="btn primary" data-m="new">${ic('plus')}New map</button>
        <button class="btn" data-m="dup">${ic('dup')}Duplicate</button>
      </div>
    </section>
    <section>
      <h3>Files</h3>
      <div class="btnrow">
        ${dlOk ? `<button class="btn" data-m="png">${ic('image')}Save image of this floor</button><button class="btn" data-m="json">${ic('save')}Save backup file</button>` : ''}
        <button class="btn" data-m="import">${ic('open')}Open backup file</button>
      </div>
      <p>${Store.cloud ? 'Maps save to your Claude account automatically. A backup file is a copy you can keep anywhere.' : 'Maps are saved in this browser only. Save a backup file now and then so a cleared browser can’t take them with it.'}${dlOk ? '' : ' Saving files isn’t available in this view.'}</p>
    </section>
    <section>
      <h3>Your maps</h3>
      <div class="list" id="m-list"><p>Loading…</p></div>
    </section>`;
  const name = body.querySelector('#m-name');
  name.addEventListener('change', () => { const v = name.value.trim(); if (v && v !== map.name) { map.name = v.slice(0, 80); markDirty(); renderHeader(); listMaps(body); } });
  body.querySelectorAll('[data-m]').forEach(b => b.addEventListener('click', async () => {
    const a = b.dataset.m;
    if (a === 'new') { await newMapNamed('New map'); closeSheet(); toast('New map created. Rename it from the Maps menu.'); }
    else if (a === 'dup') { await flushSave(); const c = normalize(clone(map)); c.id = uid(); c.name = (map.name + ' copy').slice(0, 80); delete c.sample; openMap(c); await saveNow(); refreshSheet(); toast('Duplicated. You are now editing the copy.'); }
    else if (a === 'png') exportPNG();
    else if (a === 'json') exportJSON();
    else if (a === 'import') $('#importfile').click();
  }));
  listMaps(body);
}
async function listMaps(body) {
  const list = await Store.listAll();
  const el = body.querySelector('#m-list'); if (!el) return;
  if (!list.some(e => e.id === map.id)) list.unshift({ ...Store.meta(map), unsaved: true });
  el.innerHTML = list.map(e => `
    <div class="lrow${e.id === map.id ? ' current' : ''}">
      <div class="grow"><button class="open" data-open="${esc(e.id)}">
        <div class="t">${esc(e.name || 'Untitled map')}</div>
        <div class="s">${e.count ?? 0} items · ${e.floors ?? 1} floor${(e.floors ?? 1) === 1 ? '' : 's'}${e.updated ? ' · ' + ago(e.updated) : ''}</div>
      </button></div>
      ${e.id === map.id ? '<span class="pill">Open</span>' : ''}
      <button class="btn danger" data-delmap="${esc(e.id)}" aria-label="Delete map">${ic('del')}</button>
    </div>`).join('');
  el.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', async () => {
    if (b.dataset.open === map.id) { closeSheet(); return; }
    await openMapById(b.dataset.open); closeSheet();
  }));
  el.querySelectorAll('[data-delmap]').forEach(b => b.addEventListener('click', () => armButton(b, 'Delete?', async () => {
    const id = b.dataset.delmap;
    await Store.del(id);
    if (id === map.id) {
      clearTimeout(saveTimer); saveTimer = null;
      const rest = (await Store.listAll()).filter(e => e.id !== id);
      if (rest.length) await openMapById(rest[0].id); else await newMapNamed('New map');
    }
    refreshSheet();
  })));
}
$('#mapbtn').addEventListener('click', () => openSheet('Maps', buildMaps));
$('#importfile').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if (!f) return;
  const r = new FileReader();
  r.onload = async () => {
    try {
      const m = normalize(JSON.parse(r.result));
      await flushSave();
      m.id = uid(); delete m.sample; m.updated = Date.now();
      openMap(m); await saveNow(); closeSheet();
      toast(`Opened “${m.name}” from the backup file.`);
    } catch { toast('That file isn’t a map backup. Pick a .json file saved from this app.'); }
  };
  r.readAsText(f);
});

async function offerFile(filename, data) {
  if (!Store.dl) { toast('Saving files isn’t available in this view.'); return; }
  try { await Store.dl.save({ filename, data }); toast('File saved.'); }
  catch (e) {
    if (e && e.code === 'declined') return;
    toast(e && e.code === 'rate_limited' ? 'A save is already waiting for you to confirm.' : 'The file couldn’t be saved here.');
  }
}
function exportJSON() { offerFile(`${slug(map.name)}.json`, JSON.stringify(map, null, 1)); }
function exportPNG() {
  const items = map.items.filter(i => i.floor === map.activeFloor);
  const b = itemsBounds(items) || { x0: -10, y0: -10, x1: 10, y1: 10 };
  const pad = 3, wM = b.x1 - b.x0 + pad * 2, hM = b.y1 - b.y0 + pad * 2;
  const s = clamp(1800 / Math.max(wM, hM), 8, 60), foot = 44;
  const W = Math.ceil(wM * s), H = Math.ceil(hM * s);
  const c = document.createElement('canvas'); c.width = W; c.height = H + foot;
  const x = c.getContext('2d');
  drawScene(x, { W, H, cx: (b.x0 + b.x1) / 2, cy: (b.y0 + b.y1) / 2, s }, false);
  x.fillStyle = T.surface; x.fillRect(0, H, W, foot);
  x.fillStyle = T.fg; x.font = `600 18px ${T.display}`; x.textBaseline = 'middle'; x.textAlign = 'left';
  const floor = map.floors[floorIndex()].name;
  x.fillText(`${map.name} — ${floor}`, 14, H + foot / 2);
  x.fillStyle = T.muted; x.font = `500 14px ${T.mono}`; x.textAlign = 'right';
  const minor = [1, 5, 25, 125].find(v => v * s >= 7) || 125;
  x.fillText(`1 square = ${minor} m`, W - 14, H + foot / 2);
  c.toBlob(blob => { if (blob) offerFile(`${slug(map.name)}-${slug(floor)}.png`, blob); else toast('The image couldn’t be made.'); }, 'image/png');
}

/* Floors */
function switchFloor(id) { map.activeFloor = id; selectedId = null; livePre = null; renderAll(); LS.set('mm2.map.' + map.id, JSON.stringify(map)); }
$('#floorup').addEventListener('click', () => { const i = floorIndex(); if (i < map.floors.length - 1) switchFloor(map.floors[i + 1].id); });
$('#floordown').addEventListener('click', () => { const i = floorIndex(); if (i > 0) switchFloor(map.floors[i - 1].id); });
$('#floorname').addEventListener('click', () => openSheet('Floors', buildFloors));
function buildFloors(body) {
  const rows = map.floors.map((f, i) => ({ f, i })).reverse();
  body.innerHTML = `
    <section style="border-top:0;padding-top:0">
      <p>Top floor first. The floor below the one you are on shows faintly so you can line things up.</p>
      <div class="btnrow"><button class="btn" data-f="above">${ic('plus')}Add floor on top</button><button class="btn" data-f="below">${ic('plus')}Add basement</button></div>
      <div class="list">${rows.map(({ f }) => {
        const n = map.items.filter(it => it.floor === f.id).length, cur = f.id === map.activeFloor;
        return `<div class="lrow${cur ? ' current' : ''}">
          <div class="grow"><input class="field" data-fname="${esc(f.id)}" value="${esc(f.name)}" maxlength="30" aria-label="Floor name"></div>
          <span class="s muted mono" style="font-size:12px">${n}</span>
          ${cur ? '<span class="pill">Here</span>' : `<button class="btn" data-go="${esc(f.id)}">Go</button>`}
          <button class="btn danger" data-delfloor="${esc(f.id)}" aria-label="Delete floor"${map.floors.length === 1 ? ' disabled' : ''}>${ic('del')}</button>
        </div>`; }).join('')}</div>
      <label class="toggle"><input type="checkbox" id="f-below"${showBelow ? ' checked' : ''}>Show the floor below, faded</label>
    </section>`;
  body.querySelectorAll('[data-f]').forEach(b => b.addEventListener('click', () => {
    const above = b.dataset.f === 'above';
    const f = { id: uid(), name: above ? `Floor ${map.floors.length}` : (map.floors.some(x => x.name === 'Basement') ? `Basement ${map.floors.filter(x => x.name.startsWith('Basement')).length + 1}` : 'Basement') };
    mutate(() => { above ? map.floors.push(f) : map.floors.unshift(f); map.activeFloor = f.id; });
    selectedId = null; renderAll(); refreshSheet();
  }));
  body.querySelectorAll('[data-fname]').forEach(inp => inp.addEventListener('change', () => {
    const f = map.floors.find(x => x.id === inp.dataset.fname), v = inp.value.trim().slice(0, 30);
    if (f && v && v !== f.name) mutate(() => { f.name = v; }); else inp.value = f ? f.name : '';
  }));
  body.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => { switchFloor(b.dataset.go); refreshSheet(); }));
  body.querySelectorAll('[data-delfloor]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.delfloor, n = map.items.filter(it => it.floor === id).length;
    armButton(b, n ? `Delete + ${n} items?` : 'Delete?', () => {
      mutate(() => {
        const i = map.floors.findIndex(f => f.id === id);
        map.floors = map.floors.filter(f => f.id !== id);
        map.items = map.items.filter(it => it.floor !== id);
        if (map.activeFloor === id) map.activeFloor = map.floors[Math.max(0, i - 1)].id;
      });
      selectedId = null; renderAll(); refreshSheet();
    });
  }));
  body.querySelector('#f-below').addEventListener('change', e => { showBelow = e.target.checked; LS.set('mm2.below', showBelow ? '1' : '0'); requestDraw(); });
}

/* Enemy types */
$('#edittypes').addEventListener('click', () => openSheet('Enemy types', buildTypes));
function buildTypes(body) {
  body.innerHTML = `
    <section style="border-top:0;padding-top:0">
      <p>Rename a type or change its color. Every enemy of that type on the map updates with it.</p>
      <div class="list">${map.enemyTypes.map(t => {
        const n = map.items.filter(i => i.kind === 'enemy' && i.type === t.id).length;
        return `<div class="lrow" style="flex-wrap:wrap">
          <div class="grow" style="min-width:140px"><input class="field" data-tname="${esc(t.id)}" value="${esc(t.name)}" maxlength="24" aria-label="Enemy type name"></div>
          <span class="s muted mono" style="font-size:12px">${n} placed</span>
          <button class="btn danger" data-deltype="${esc(t.id)}" aria-label="Delete type"${map.enemyTypes.length === 1 ? ' disabled' : ''}>${ic('del')}</button>
          <div class="swatches" style="flex-basis:100%">${ENEMY_COLORS.map(c => `<button class="sw" data-tcolor="${esc(t.id)}|${c}" style="background:${c}" aria-label="Color ${c}" aria-pressed="${c === t.color}"></button>`).join('')}</div>
        </div>`; }).join('')}</div>
      <div class="btnrow"><button class="btn primary" id="t-add">${ic('plus')}Add enemy type</button></div>
    </section>`;
  body.querySelectorAll('[data-tname]').forEach(inp => inp.addEventListener('change', () => {
    const t = map.enemyTypes.find(x => x.id === inp.dataset.tname), v = inp.value.trim().slice(0, 24);
    if (t && v && v !== t.name) mutate(() => { t.name = v; }); else inp.value = t ? t.name : '';
  }));
  body.querySelectorAll('[data-tcolor]').forEach(b => b.addEventListener('click', () => {
    const [id, c] = b.dataset.tcolor.split('|'), t = map.enemyTypes.find(x => x.id === id);
    if (t) { mutate(() => { t.color = c; }); refreshSheet(); }
  }));
  body.querySelectorAll('[data-deltype]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.deltype, n = map.items.filter(i => i.kind === 'enemy' && i.type === id).length;
    armButton(b, n ? `Delete + ${n} enemies?` : 'Delete?', () => {
      mutate(() => { map.enemyTypes = map.enemyTypes.filter(t => t.id !== id); map.items = map.items.filter(i => !(i.kind === 'enemy' && i.type === id)); });
      if (tool === 'enemy:' + id) tool = 'select';
      if (!selected()) selectedId = null;
      renderAll(); refreshSheet();
    });
  }));
  body.querySelector('#t-add').addEventListener('click', () => {
    const used = new Set(map.enemyTypes.map(t => t.color));
    const color = ENEMY_COLORS.find(c => !used.has(c)) || ENEMY_COLORS[map.enemyTypes.length % ENEMY_COLORS.length];
    mutate(() => map.enemyTypes.push({ id: uid(), name: `Enemy ${map.enemyTypes.length + 1}`, color }));
    refreshSheet();
    const inputs = body.querySelectorAll('[data-tname]'); const last = inputs[inputs.length - 1]; if (last) { last.focus(); last.select(); }
  });
}

/* ---------- toolbar, keys, toast ---------- */
document.querySelectorAll('[data-tool]').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));
$('#snapbtn').addEventListener('click', () => { snap = !snap; LS.set('mm2.snap', snap ? '1' : '0'); renderTools(); toast(snap ? 'Snap on: 0.5 m steps and 15° turns.' : 'Snap off: free placement.'); });
$('#fitbtn').addEventListener('click', fitView);
$('#undo').addEventListener('click', undo);
$('#redo').addEventListener('click', redo);
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea')) return;
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
  else if ((e.key === 'Delete' || e.key === 'Backspace') && selected()) { e.preventDefault(); const id = selectedId; mutate(() => { map.items = map.items.filter(i => i.id !== id); }); selectedId = null; renderAll(); }
  else if (e.key === 'Escape') { if (sheetEl) closeSheet(); else { selectedId = null; setTool('select'); } }
});
let toastTimer = null, toastEl = null;
function toast(msg) {
  if (!toastEl) { toastEl = document.createElement('div'); toastEl.className = 'toast'; toastEl.setAttribute('role', 'status'); document.body.appendChild(toastEl); }
  toastEl.textContent = msg; toastEl.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { toastEl.hidden = true; }, 3200);
}
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------- start ---------- */
readTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readTheme);
new MutationObserver(readTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(requestDraw);

(function boot() {
  const lastId = LS.get('mm2.current');
  let m = null;
  if (lastId) { try { m = normalize(Store.loadLocal(lastId)); } catch { m = null; } }
  openMap(m || sampleMap());
  setStatus(m ? 'Saved on this device' : 'Example', 'ok');
  Store.init().then(async () => {
    if (!Store.cloud) { if (m) setStatus('Saved on this device', 'ok'); return; }
    const list = await Store.listCloud();
    const newest = list.sort((a, b) => (b.updated || 0) - (a.updated || 0))[0];
    if (!edits && newest && (newest.updated || 0) > (map.updated || 0) && newest.id !== map.id) {
      const cm = await Store.loadCloud(newest.id);
      if (cm && !edits) { try { openMap(normalize(cm)); return; } catch {} }
    }
    if (!map.sample && !list.some(e => e.id === map.id)) saveNow();
    else if (!map.sample) setStatus('Saved', 'ok');
  });
})();
})();
</script>
