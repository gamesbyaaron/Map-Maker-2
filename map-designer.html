<title>FPS Map Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/polygon-clipping@0.15.7/dist/polygon-clipping.umd.min.js"></script>
<style>
/* Layout: a main menu over one full-height workspace. Top bar, map canvas, enemy tray + tool dock.
   Selecting something shows a slim bar over the bottom of the canvas; "More" expands it. */
:root {
  --bg: #e4e9ee;
  --surface: #fbfcfd;
  --surface-2: #eef2f5;
  --fg: #17212b;
  --muted: #5a6776;
  --line: #d2d9e1;
  --accent: #0d8a7c;
  --accent-fg: #ffffff;
  --accent-soft: #d4efea;
  --warn: #c98a0a;
  --ok: #2f9e5b;
  --danger: #d23c41;
  --grid-bg: #f4f6f8;
  --grid-minor: #e2e7ec;
  --grid-major: #c4cdd7;
  --wall: #2a3542;
  --enemy-ring: #ffffff;
  --is-dark: 0;
  --shadow: 0 6px 24px rgba(20, 32, 44, .14);
  --font-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1117; --surface: #141b23; --surface-2: #1b242e; --fg: #e3e9ef; --muted: #8b98a7; --line: #27323e;
    --accent: #2fc4ae; --accent-fg: #052520; --accent-soft: #11362f; --warn: #e3a52a; --danger: #f0575c; --ok: #46c27a;
    --grid-bg: #0f151b; --grid-minor: #18212a; --grid-major: #26313d; --wall: #b9c4cf; --enemy-ring: #0c1117; --is-dark: 1;
    --shadow: 0 6px 24px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1117; --surface: #141b23; --surface-2: #1b242e; --fg: #e3e9ef; --muted: #8b98a7; --line: #27323e;
  --accent: #2fc4ae; --accent-fg: #052520; --accent-soft: #11362f; --warn: #e3a52a; --danger: #f0575c; --ok: #46c27a;
  --grid-bg: #0f151b; --grid-minor: #18212a; --grid-major: #26313d; --wall: #b9c4cf; --enemy-ring: #0c1117; --is-dark: 1;
  --shadow: 0 6px 24px rgba(0, 0, 0, .45);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font: 400 14px/1.4 var(--font-body);
  display: flex; flex-direction: column; overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

/* Main menu */
.menu {
  position: fixed; inset: 0; z-index: 30; overflow-y: auto;
  background:
    linear-gradient(var(--grid-minor) 1px, transparent 1px) 0 0 / 24px 24px,
    linear-gradient(90deg, var(--grid-minor) 1px, transparent 1px) 0 0 / 24px 24px,
    var(--grid-bg);
  padding: calc(env(safe-area-inset-top, 0px) + 12vh) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 32px) max(16px, env(safe-area-inset-left, 0px));
}
.menu-inner { display: flex; flex-direction: column; align-items: center; gap: 40px; max-width: 420px; margin: 0 auto; text-align: center; }
.menu-title { display: grid; gap: 10px; justify-items: center; }
.menu-title h1 { margin: 0; font: 700 clamp(34px, 10vw, 52px)/1 var(--font-display); letter-spacing: .01em; text-wrap: balance; }
.menu-title p { margin: 0; color: var(--muted); font-size: 14px; }
.menu-mark { width: 64px; height: 64px; color: var(--accent); }
.menu-mark svg { width: 64px; height: 64px; stroke-width: 1.6; }
.menu-buttons { display: grid; gap: 12px; width: min(300px, 100%); }
.mbtn {
  height: 56px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow);
  font: 600 16px var(--font-display); letter-spacing: .1em; text-transform: uppercase;
}
.mbtn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
.mcontinue { background: none; border: 0; color: var(--accent); font-weight: 600; padding: 8px 12px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mcontinue span { color: var(--muted); font-weight: 500; }

/* Top bar */
.top {
  flex: none; display: flex; align-items: center; gap: 8px;
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.mapbtn { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; background: none; border: 0; padding: 2px 0; text-align: left; }
.eyebrow { font: 600 10px/1.2 var(--font-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); display: flex; gap: 6px; align-items: center; white-space: nowrap; }
.eyebrow .tag { color: var(--warn); }
.mapname { font: 600 18px/1.2 var(--font-display); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 4px; }
.mapname > span { overflow: hidden; text-overflow: ellipsis; }
.mapname svg { width: 16px; height: 16px; color: var(--muted); }
.status { display: flex; align-items: center; gap: 6px; background: none; border: 0; padding: 6px 4px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.status i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.status[data-state="ok"] i { background: var(--accent); }
.status[data-state="pending"] i { background: var(--warn); }
.status[data-state="err"] i { background: var(--danger); }
.iconbtn { width: 40px; height: 40px; flex: none; display: grid; place-items: center; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); }
.iconbtn:disabled { opacity: .35; cursor: default; }
@media (max-width: 520px) { .status span { display: none; } }

/* Stage */
.stage { flex: 1; min-height: 0; position: relative; overflow: hidden; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
.floors {
  position: absolute; top: 12px; right: max(12px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; align-items: stretch; width: 88px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden;
}
.floors button { border: 0; background: none; display: grid; place-items: center; padding: 5px 4px; }
.floors button:disabled { opacity: .3; cursor: default; }
.floors .fname { border-block: 1px solid var(--line); padding: 6px; gap: 1px; }
.floors .fname b { font: 600 12px/1.15 var(--font-display); letter-spacing: .06em; text-transform: uppercase; text-align: center; overflow-wrap: anywhere; }
.floors .fname small { font: 500 10px var(--font-mono); color: var(--muted); }
.hint {
  position: absolute; top: 12px; left: max(12px, env(safe-area-inset-left, 0px)); width: fit-content; max-width: calc(100% - 124px);
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 7px 11px;
  font-size: 12.5px; color: var(--fg); box-shadow: var(--shadow); pointer-events: none;
}
.scale {
  position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px; display: flex; align-items: center; gap: 6px;
  font: 500 11px var(--font-mono); color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px;
}
.scale .sq { width: 12px; height: 12px; border: 1.5px solid var(--muted); border-radius: 2px; }

/* Selection bar */
.bar {
  position: absolute; left: 8px; right: 8px; bottom: 8px; margin-inline: auto; max-width: 560px; max-height: 50%;
  overflow-y: auto; overscroll-behavior: contain;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
}
.bar-row { position: sticky; top: 0; z-index: 1; background: var(--surface); display: flex; align-items: center; gap: 6px; padding: 7px 7px 7px 12px; }
.bar-title { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.bar-title strong { font: 600 15px/1.2 var(--font-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-title span { font: 500 11.5px/1.3 var(--font-mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-row > button, .ministep button { width: 36px; height: 36px; display: grid; place-items: center; border: 0; border-radius: 9px; background: var(--surface-2); flex: none; }
.bar-row > button.danger { color: var(--danger); }
.bar-row > button.armed { width: auto; padding: 0 10px; background: var(--danger); color: #fff; font-size: 12px; font-weight: 600; }
.bar-row > button[aria-expanded="true"] { background: var(--accent-soft); color: var(--accent); }
.bar-row > button[aria-expanded="true"] svg { transform: rotate(180deg); }
.ministep { display: flex; align-items: center; gap: 2px; flex: none; }
.ministep button { width: 30px; font-size: 18px; line-height: 1; }
.ministep span { min-width: 22px; text-align: center; font: 600 15px var(--font-mono); }
.bar-more { display: grid; gap: 12px; padding: 10px 12px 14px; border-top: 1px solid var(--line); }
.prow { display: grid; grid-template-columns: 62px 1fr; align-items: center; gap: 10px; }
.prow > .lbl { font: 600 11px var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.ctrl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.ctrl input[type="range"] { flex: 1; min-width: 120px; accent-color: var(--accent); height: 28px; }
.ctrl output { min-width: 84px; font: 500 13px var(--font-mono); }
.ctrl .note { font-size: 12.5px; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { border: 0; background: none; padding: 7px 12px; font-weight: 500; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.stepper span { padding: 0 2px 0 9px; font: 600 11px var(--font-display); color: var(--muted); }
.stepper button { width: 32px; height: 34px; border: 0; background: var(--surface-2); font-size: 18px; line-height: 1; }
.stepper input, .num input { width: 56px; height: 34px; border: 0; background: none; color: var(--fg); text-align: center; font: 500 13px var(--font-mono); -moz-appearance: textfield; }
.num { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 9px; }
.num span { padding-left: 9px; font: 600 11px var(--font-display); color: var(--muted); }
.num input { width: 70px; }
input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.lockbtn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 9px; border: 1px solid var(--line); background: none; color: var(--muted); }
.lockbtn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.smallbtn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 11px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 500; }
.smallbtn svg { width: 16px; height: 16px; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); padding: 0; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent); }
.typechip { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px 5px 5px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 500; }
.typechip i { width: 20px; height: 20px; border-radius: 50%; }
.typechip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }

/* Dock */
.dock {
  flex: none; background: var(--surface); border-top: 1px solid var(--line);
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
  display: grid; gap: 6px;
}
.trayhead { display: flex; align-items: center; justify-content: space-between; }
.trayhead .eyebrow button { background: none; border: 0; color: var(--accent); font: inherit; letter-spacing: inherit; text-transform: inherit; padding: 4px 0 4px 8px; }
.tray { display: flex; gap: 8px; overflow-x: auto; touch-action: pan-x; scrollbar-width: none; padding: 2px 0 4px; }
.tray::-webkit-scrollbar { display: none; }
.chip {
  flex: none; display: flex; align-items: center; gap: 8px; padding: 5px 13px 5px 5px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface-2); font-weight: 500; touch-action: pan-x; user-select: none; -webkit-user-select: none;
}
.chip i { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 600 13px var(--font-display); font-style: normal; box-shadow: 0 0 0 2px var(--enemy-ring) inset; }
.chip.player { margin-right: 6px; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.tools { display: flex; gap: 4px; }
.tool {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px; border: 0; border-radius: 10px; background: none; color: var(--muted);
  font: 600 10.5px var(--font-display); letter-spacing: .06em; text-transform: uppercase;
}
.tool[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.tool.sep { margin-left: 6px; }
.ghost.pv svg { width: 28px; height: 28px; }
.ghost { position: fixed; z-index: 50; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; box-shadow: 0 0 0 3px var(--enemy-ring), var(--shadow); pointer-events: none; display: grid; place-items: center; font: 600 15px var(--font-display); }

/* Sheets */
.backdrop { position: fixed; inset: 0; z-index: 40; background: rgba(8, 14, 20, .45); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 560px; max-height: 88%; overflow-y: auto; overscroll-behavior: contain;
  background: var(--surface); border-radius: 18px 18px 0 0; box-shadow: var(--shadow);
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.sheet-head { position: sticky; top: 0; z-index: 1; background: var(--surface); display: flex; align-items: center; justify-content: space-between; padding: 14px 0 10px; }
.sheet-head h2 { margin: 0; font: 600 20px var(--font-display); }
.doc section { display: grid; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
.doc section:first-child { border-top: 0; padding-top: 0; }
.doc h3 { margin: 0; font: 600 11px var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.doc p { margin: 0; color: var(--muted); font-size: 13px; max-width: 60ch; }
.setrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.setrow > span { font-weight: 500; }
.field { width: 100%; height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); padding: 0 12px; font: 500 15px var(--font-body); }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 13px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 500; }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-fg); }
.btn.danger { color: var(--danger); }
.btn.armed { background: var(--danger); color: #fff; border-color: transparent; }
.btn svg { width: 17px; height: 17px; }
.list { display: grid; gap: 6px; }
.lrow { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); min-width: 0; }
.lrow.current { border-color: var(--accent); }
.lrow .grow { flex: 1; min-width: 0; }
.lrow .open { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 2px 0; }
.lrow .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lrow .s { font-size: 12px; color: var(--muted); }
.lrow .field { height: 36px; }
.lrow .sw { width: 24px; height: 24px; }
.pill { font: 600 10px var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.toggle { display: flex; align-items: center; gap: 10px; font-weight: 500; }
.toggle input { width: 20px; height: 20px; accent-color: var(--accent); }
/* Pages */
.page { position: fixed; inset: 0; z-index: 35; background: var(--bg); display: flex; flex-direction: column; }
.page-head {
  flex: none; display: flex; align-items: center; gap: 12px; background: var(--surface); border-bottom: 1px solid var(--line);
  padding: calc(env(safe-area-inset-top, 0px) + 10px) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
}
.page-head h2 { margin: 0; font: 600 20px var(--font-display); }
.page-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.page-inner { max-width: 640px; margin: 0 auto; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.tile { display: grid; justify-items: center; gap: 6px; padding: 12px 6px 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; font-size: 13px; }
.tile svg { width: 44px; height: 44px; stroke-width: 1.6; }
.card { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; }
.card-head { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: none; border: 0; text-align: left; }
.card-head i { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 600 16px var(--font-display); font-style: normal; flex: none; box-shadow: 0 0 0 2px var(--enemy-ring) inset; }
.card-head .grow { flex: 1; min-width: 0; }
.card-head .t { font: 600 16px var(--font-display); }
.card-head .s { font: 500 12px var(--font-mono); color: var(--muted); }
.card-head > svg { color: var(--muted); }
.card-head[aria-expanded="true"] > svg { transform: rotate(180deg); }
.card-body { display: grid; gap: 12px; padding: 12px 12px 14px; border-top: 1px solid var(--line); }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stats label, .card-body > label { display: grid; gap: 4px; font: 600 11px var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.stats input, .card-body textarea { width: 100%; height: 38px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); padding: 0 10px; font: 500 14px var(--font-mono); }
.card-body textarea { height: 64px; padding: 8px 10px; font: 400 14px var(--font-body); resize: vertical; text-transform: none; letter-spacing: 0; }
.iconbtn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.bar-row > button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.locked-ui .tray, .locked-ui [data-tool="circle"], .locked-ui [data-tool="poly"], .locked-ui #edittypes { opacity: .35; pointer-events: none; }
.setrow .ctrl { flex: 1; justify-content: flex-end; min-width: 200px; flex-wrap: nowrap; }
.setrow output { min-width: 58px; text-align: right; font: 500 13px var(--font-mono); }
.stepper button:disabled, .stepper input:disabled { opacity: .4; }
.chip i.doorico { background: var(--surface); color: var(--warn); box-shadow: inset 0 0 0 1px var(--line); }
.chip i.doorico svg { width: 16px; height: 16px; }
.tabs { display: flex; gap: 2px; }
.tabs button { background: none; border: 0; padding: 4px 9px; border-radius: 7px; font: 600 10.5px var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }
.chip i.pv, .card-head i.pv { background: var(--surface); border-radius: 7px; box-shadow: inset 0 0 0 1px var(--line); padding: 2px; }
.chip i.pv svg { width: 22px; height: 22px; }
.card-head i.pv svg { width: 30px; height: 30px; }
.chip.newchip { padding: 5px 13px; color: var(--accent); border-style: dashed; }
.chip.newchip svg { width: 18px; height: 18px; }
.trayempty { color: var(--muted); font-size: 13px; padding: 8px 2px; }
i.ic-square { border-radius: 6px !important; }
i.ic-diamond { border-radius: 4px !important; transform: rotate(45deg) scale(.82); }

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const snapTo = (v, s) => Math.round(v / s) * s;

/* ---------- settings ---------- */
const settings = (() => {
  const d = { snap: LS.get('mm2.snap') !== '0', step: 0.5, rotStep: 15, below: LS.get('mm2.below') !== '0', style: 'room', join: 'merge',

/* ---------- bestiary: enemy types shared by every map ---------- */
function normType(t) {

  return { id: String(t.id || uid()), name: String(t.name || 'Enemy').slice(0, 24), color: isHex(t.color) ? t.color : ENEMY_COLORS[0],

  data: { types: DEFAULT_TYPES.map(normType), deleted: [], updated: 0 },
  timer: null,
  load() {
    try {

    if (!Store.cloud) return;

    try { const snap = await Store.col().doc('_bestiary').get(); if (snap.exists) c = JSON.parse(snap.data().json); } catch { return; }
    if (!c || !Array.isArray(c.types)) { this.push(); return; }
    const local = this.data, cloud = { types: c.types.map(normType), deleted: Array.isArray(c.deleted) ? c.deleted : [], updated: +c.updated || 0 };
    const [base, other] = cloud.updated > local.updated ? [cloud, local] : [local, cloud];
    const deleted = [...new Set([...base.deleted, ...other.deleted])];
    const types = base.types.filter(t => !deleted.includes(t.id));
    for (const t of other.types) if (!types.some(x => x.id === t.id) && !deleted.includes(t.id)) types.push(t);
    if (!types.length) types.push(...DEFAULT_TYPES.map(normType));
    this.data = { types, deleted, updated: Math.max(base.updated, other.updated) };

// fold a map's own copy of its enemy types into the bestiary and point its enemies at bestiary ids
function absorbTypes(m) {
  const B = Bestiary.data, remap = {};
  let changed = false;
  for (const t of m.enemyTypes || []) {
    if (B.types.some(b => b.id === t.id) || B.deleted.includes(t.id)) continue;
    const same = B.types.find(b => b.name.trim().toLowerCase() === t.name.trim().toLowerCase());
    if (same) remap[t.id] = same.id; else { B.types.push(normType(t)); changed = true; }

  for (const it of m.items) if (it.kind === 'enemy') {
    if (remap[it.type]) it.type = remap[it.type];
    if (!B.types.some(b => b.id === it.type)) it.type = B.types[0].id;

/* ---------- library: custom shapes (masters) and symbols, shared by every map ---------- */
function normSymbol(t) {

  for (const k of Object.keys(show)) {

    el.addEventListener('change', saveSettings);

async function offerFile(filename, data) {
  if (!Store.dl) { toast('Saving files isn’t available in this view.'); return; }
  try { await Store.dl.save({ filename, data }); toast('File saved.'); }
  catch (e) {
    if (e && e.code === 'declined') return;
    toast(e && e.code === 'rate_limited' ? 'A save is already waiting for you to confirm.' : 'The file couldn’t be saved here.');
  }
}
function exportJSON() { embedDefs(map); offerFile(`${slug(map.name)}.json`, JSON.stringify(map, null, 1)); }
function exportPNG() {
  const items = map.items.filter(i => i.floor === map.activeFloor);
  const b = itemsBounds(items) || { x0: -10, y0: -10, x1: 10, y1: 10 };
  const pad = 3, wM = b.x1 - b.x0 + pad * 2, hM = b.y1 - b.y0 + pad * 2;
  const s = clamp(1800 / Math.max(wM, hM), 8, 60), foot = 44;
  const W = Math.ceil(wM * s), H = Math.ceil(hM * s);
  const c = document.createElement('canvas'); c.width = W; c.height = H + foot;
  const x = c.getContext('2d');
  drawScene(x, { W, H, cx: (b.x0 + b.x1) / 2, cy: (b.y0 + b.y1) / 2, s }, false);
  x.fillStyle = T.surface; x.fillRect(0, H, W, foot);
  x.fillStyle = T.fg; x.font = `600 18px ${T.display}`; x.textBaseline = 'middle'; x.textAlign = 'left';
  const floor = map.floors[floorIndex()].name;
  x.fillText(`${map.name} — ${floor}`, 14, H + foot / 2);
  x.fillStyle = T.muted; x.font = `500 14px ${T.mono}`; x.textAlign = 'right';
  x.fillText(`1 square = ${gridStep(s)} m`, W - 14, H + foot / 2);
  c.toBlob(blob => { if (blob) offerFile(`${slug(map.name)}-${slug(floor)}.png`, blob); else toast('The image couldn’t be made.'); }, 'image/png');
}

  body.querySelector('#f-below').addEventListener('change', e => { settings.below = e.target.checked; saveSettings(); requestDraw(); });
}

$('#edittypes').addEventListener('click', () => trayTab === 'units' ? openPage('Bestiary', buildBestiary, 'editor') : openPage('Shapes & Symbols', buildShapes, 'editor'));

/* ---------- toolbar, keys, toast ---------- */
document.querySelectorAll('[data-tool]').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));
$('#snapbtn').addEventListener('click', () => { settings.snap = !settings.snap; saveSettings(); renderTools(); toast(settings.snap ? `Snap on: ${settings.step} m steps and ${settings.rotStep}° turns.` : 'Snap off: free placement.'); });
$('#fitbtn').addEventListener('click', fitView);
$('#lockmap').addEventListener('click', () => {
  map.locked = !map.locked; clearSel(); tool = 'select';
  markDirty(); renderAll();
  toast(map.locked ? 'Map locked. Nothing can be moved until you unlock it.' : 'Map unlocked.');
});
$('#undo').addEventListener('click', undo);
$('#redo').addEventListener('click', redo);
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea')) return;
  if (Sim.active) { if (e.key === 'Escape') simStop(); else if (e.key === ' ') { e.preventDefault(); $('#simplay').click(); } return; }
  if (e.key === 'Escape') { if (sheetEl) closeSheet(); else if (pageBuild) closePage(); else if (!menuOpen()) { clearSel(); setTool('select'); } return; }
  if (menuOpen() || sheetEl || pageBuild) return;
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
  else if ((e.key === 'Delete' || e.key === 'Backspace') && selItems().length) {
    e.preventDefault();
    const ids = new Set(selItems().filter(i => !i.locked).map(i => i.id));
    mutate(() => { map.items = map.items.filter(i => !ids.has(i.id)); }); clearSel(); renderAll();
  }
});
let toastTimer = null, toastEl = null;
function toast(msg) {
  if (!toastEl) { toastEl = document.createElement('div'); toastEl.className = 'toast'; toastEl.setAttribute('role', 'status'); document.body.appendChild(toastEl); }
  toastEl.textContent = msg; toastEl.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { toastEl.hidden = true; }, 3600);
}

/* ---------- start ---------- */
readTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readTheme);
new MutationObserver(readTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(requestDraw);

(function boot() {
  Bestiary.load(); Library.load();
  const lastId = LS.get('mm2.current');
  let m = null;
  if (lastId) { try { m = normalize(Store.loadLocal(lastId)); } catch { m = null; } }
  openMap(m || sampleMap());
  if (m) setStatus('Saved on this device', 'ok');
  Store.init().then(async () => {
    if (!Store.cloud) return;
    Bestiary.sync(); Library.sync();
    const list = await Store.listCloud();
    const newest = list.sort((a, b) => (b.updated || 0) - (a.updated || 0))[0];
    if (!edits && newest && (map.sample || (newest.updated || 0) > (map.updated || 0)) && newest.id !== map.id) {
      const cm = await Store.loadCloud(newest.id);
      if (cm && !edits) { try { openMap(normalize(cm)); return; } catch {} }
    }
    if (!map.sample && !list.some(e => e.id === map.id)) saveNow();
    else if (!map.sample) setStatus('Saved', 'ok');
  });
})();
})();
</script>
