const ICON = {
  dup: '<path d="M8 8h12v12H8z"/><path d="M4 16V4h12"/>',

  if (s < 3600) return Math.floor(s / 60) + ' min ago';

}
const LS = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },

};

/* ---------- settings ---------- */
const settings = (() => {
  const d = { snap: LS.get('mm2.snap') !== '0', step: 0.5, rotStep: 15, below: LS.get('mm2.below') !== '0', style: 'room', join: 'merge',
    roomLine: 0.3, roomAlpha: 0.35, solidLine: 1.5, solidAlpha: 1 };

})();
const saveSettings = () => LS.set('mm2.settings', JSON.stringify(settings));

/* ---------- bestiary: enemy types shared by every map ---------- */
function normType(t) {
  const num = (v, d, a, b) => Number.isFinite(+v) ? clamp(+v, a, b) : d;
  return { id: String(t.id || uid()), name: String(t.name || 'Enemy').slice(0, 24), color: isHex(t.color) ? t.color : ENEMY_COLORS[0],
    hp: num(t.hp, 100, 1, 9999), speed: num(t.speed, 3.5, 0, 50), range: num(t.range, 25, 1, 500), acc: num(t.acc, 50, 0, 100), notes: String(t.notes || '').slice(0, 200) };
}
const Bestiary = {
  data: { types: DEFAULT_TYPES.map(normType), deleted: [], updated: 0 },
  timer: null,
  load() {
    try {
      const d = JSON.parse(LS.get('mm2.bestiary') || 'null');
      if (d && Array.isArray(d.types) && d.types.length) this.data = { types: d.types.map(normType), deleted: Array.isArray(d.deleted) ? d.deleted : [], updated: +d.updated || 0 };
    } catch {}
  },
  save() {
    this.data.updated = Date.now();
    LS.set('mm2.bestiary', JSON.stringify(this.data));
    clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), 800);
  },
  async push() {
    if (!Store.cloud) return;
    try { await Store.col().doc('_bestiary').set({ updated: this.data.updated, json: JSON.stringify(this.data) }); } catch {}
  },
  // union of this device's list and the account's list; the newer one wins on conflicts
  async sync() {
    if (!Store.cloud) return;
    let c = null;
    try { const snap = await Store.col().doc('_bestiary').get(); if (snap.exists) c = JSON.parse(snap.data().json); } catch { return; }
    if (!c || !Array.isArray(c.types)) { this.push(); return; }
    const local = this.data, cloud = { types: c.types.map(normType), deleted: Array.isArray(c.deleted) ? c.deleted : [], updated: +c.updated || 0 };
    const [base, other] = cloud.updated > local.updated ? [cloud, local] : [local, cloud];
    const deleted = [...new Set([...base.deleted, ...other.deleted])];
    const types = base.types.filter(t => !deleted.includes(t.id));
    for (const t of other.types) if (!types.some(x => x.id === t.id) && !deleted.includes(t.id)) types.push(t);
    if (!types.length) types.push(...DEFAULT_TYPES.map(normType));
    this.data = { types, deleted, updated: Math.max(base.updated, other.updated) };
    LS.set('mm2.bestiary', JSON.stringify(this.data));
    this.push();
    absorbTypes(map); renderAll(); refreshSheet();
  },
};
// fold a map's own copy of its enemy types into the bestiary and point its enemies at bestiary ids
function absorbTypes(m) {
  const B = Bestiary.data, remap = {};

    if (B.types.some(b => b.id === t.id) || B.deleted.includes(t.id)) continue;
    const same = B.types.find(b => b.name.trim().toLowerCase() === t.name.trim().toLowerCase());
    if (same) remap[t.id] = same.id; else { B.types.push(normType(t)); changed = true; }
  }

    if (remap[it.type]) it.type = remap[it.type];
    if (!B.types.some(b => b.id === it.type)) it.type = B.types[0].id;

const usedTypes = m => Bestiary.data.types.filter(t => m.items.some(i => i.kind === 'enemy' && i.type === t.id));

/* ---------- map model ---------- */
function blankMap(name) {
  const g = { id: uid(), name: 'Ground' };
  return { app: 'fps-map-designer', v: 3, id: uid(), name, floors: [g], activeFloor: g.id, items: [],
    enemyTypes: [], lastSides: 4, lastColor: SHAPE_COLORS[0].hex, updated: Date.now() };
}
function sampleMap() {
  const m = blankMap('Example: Warehouse');

  S(g, { x: 19, y: 0, w: 8, h: 4, style: 'room' });
  S(g, { x: -25, y: -5, w: 8, h: 10, color: WOOD, style: 'room', walls: 'divide' });
  S(g, { x: -25, y: 4, w: 8, h: 8, color: SAND, style: 'room', walls: 'divide' });
  S(g, { x: -9, y: -6, w: 2, h: 2, color: SAND });
  S(g, { x: -7, y: -6, w: 2, h: 2, color: SAND });
  S(g, { x: -9, y: -4, w: 2, h: 2, color: SAND });
  S(g, { x: 6.5, y: 5, w: 3, h: 2, rot: 15, color: SAND });

  S(g, { x: 10, y: -6, w: 4, h: 4, sides: 8, color: WATER });
  S(g, { kind: 'circle', x: 21, y: -7, w: 3, h: 3, lock: true, color: LEAF });
  S(g, { kind: 'circle', x: 22, y: 7, w: 4, h: 4, lock: true, color: LEAF });

function normalize(m) {

  m.floors = m.floors.map(f => ({ id: String(f.id || uid()), name: String(f.name || 'Floor') }));
  if (!m.floors.some(f => f.id === m.activeFloor)) m.activeFloor = m.floors[0].id;
  m.enemyTypes = (Array.isArray(m.enemyTypes) ? m.enemyTypes : []).filter(t => t && t.id).map(normType);

    if (i.kind === 'enemy') { o.type = String(i.type || ''); return o; }
    if (i.kind === 'player') { o.rot = norm360(num(i.rot, 0)); return o; }
    return Object.assign(o, {
      w: Math.max(MIN_SIZE, num(i.w, 4)), h: Math.max(MIN_SIZE, num(i.h, 4)), rot: num(i.rot, 0),

  m.lastSides = clamp(Math.round(num(m.lastSides, 4)), 3, MAX_SIDES);
  m.lastColor = isHex(m.lastColor) ? m.lastColor : SHAPE_COLORS[0].hex;

/* ---------- storage: Claude account (db) when available, this browser always ---------- */
const Store = {

      this.dl = dl;
      if (db && user) { const id = await user.id(); if (id) { this.db = db; this.uid = id; this.cloud = true; } }
    } catch {}
  },
  meta(m) { return { id: m.id, name: m.name, updated: m.updated, count: m.items.length, floors: m.floors.length }; },
  localIndex() { try { const v = JSON.parse(LS.get('mm2.index') || '[]'); return Array.isArray(v) ? v : []; } catch { return []; } },
  saveLocal(m) {

    return true;
  },
  loadLocal(id) { try { const s = LS.get('mm2.map.' + id); return s ? JSON.parse(s) : null; } catch { return null; } },
  delLocal(id) { LS.del('mm2.map.' + id); LS.set('mm2.index', JSON.stringify(this.localIndex().filter(e => e.id !== id))); },
  col() { return this.db.collection('data/users/' + this.uid); },
  async saveCloud(m, retry = true) {

    catch (e) {

      else if (code !== 'unavailable' && code !== 'resource_exhausted') this.cloud = false;
      return false;
    }
  },
  async listCloud() {
    if (!this.cloud) return [];
    try { const s = await this.col().get(); return s.docs.filter(d => !d.id.startsWith('_')).map(d => { const x = d.data() || {}; return { id: d.id, name: x.name, updated: x.updated, count: x.count, floors: x.floors }; }); }
    catch { return []; }
  },
  async loadCloud(id) {
    if (!this.cloud) return null;
    try { const s = await this.col().doc(id).get(); return s.exists ? JSON.parse(s.data().json) : null; } catch { return null; }
  },
  async del(id) { this.delLocal(id); if (this.cloud) { try { await this.col().doc(id).delete(); } catch {} } },
  async listAll() {
    const by = new Map();
    for (const e of this.localIndex()) by.set(e.id, e);

    return [...by.values()].sort((a, b) => (b.updated || 0) - (a.updated || 0));
  },
  async load(id) {

/* ---------- state ---------- */
let map = null;

  const g = groupOf(it);
  txt('dims', (it.style === 'room' ? 'Room · ' : '') + dimsText(it).replace(/\.0\b/g, '') + (g && g.size > 1 ? ' · joined' : ''));
  bar.querySelectorAll('[data-step], #p-w, #p-h, [data-act="lock"]').forEach(el => { el.disabled = !!it.sizeLock; });
  txt('sidesn', it.sides);

}

}

          </div>` : ''}
        </div>`; }).join('')}</div>
    </section>`;
  body.querySelector('#b-add').addEventListener('click', () => {
    const used = new Set(types.map(t => t.color));
    const t = normType({ name: `Enemy ${types.length + 1}`, color: ENEMY_COLORS.find(c => !used.has(c)) || ENEMY_COLORS[types.length % ENEMY_COLORS.length] });

    if (el.dataset.f === 'name' && !el.value.trim()) { el.value = t.name; return; }

  const del = card.querySelector('[data-del]');

async function offerFile(filename, data) {

  catch (e) {

function exportJSON() { map.enemyTypes = usedTypes(map); offerFile(`${slug(map.name)}.json`, JSON.stringify(map, null, 1)); }
function exportPNG() {
  const items = map.items.filter(i => i.floor === map.activeFloor);
  const b = itemsBounds(items) || { x0: -10, y0: -10, x1: 10, y1: 10 };
  const pad = 3, wM = b.x1 - b.x0 + pad * 2, hM = b.y1 - b.y0 + pad * 2;
  const s = clamp(1800 / Math.max(wM, hM), 8, 60), foot = 44;
  const W = Math.ceil(wM * s), H = Math.ceil(hM * s);
  const c = document.createElement('canvas'); c.width = W; c.height = H + foot;
  const x = c.getContext('2d');
  drawScene(x, { W, H, cx: (b.x0 + b.x1) / 2, cy: (b.y0 + b.y1) / 2, s }, false);
  x.fillStyle = T.surface; x.fillRect(0, H, W, foot);
  x.fillStyle = T.fg; x.font = `600 18px ${T.display}`; x.textBaseline = 'middle'; x.textAlign = 'left';
  const floor = map.floors[floorIndex()].name;
  x.fillText(`${map.name} — ${floor}`, 14, H + foot / 2);
  x.fillStyle = T.muted; x.font = `500 14px ${T.mono}`; x.textAlign = 'right';
  x.fillText(`1 square = ${gridStep(s)} m`, W - 14, H + foot / 2);
  c.toBlob(blob => { if (blob) offerFile(`${slug(map.name)}-${slug(floor)}.png`, blob); else toast('The image couldn’t be made.'); }, 'image/png');
}

          <button class="btn danger" data-delfloor="${esc(f.id)}" aria-label="Delete floor"${map.floors.length === 1 ? ' disabled' : ''}>${ic('del')}</button>
        </div>`; }).join('')}</div>
      <label class="toggle"><input type="checkbox" id="f-below"${settings.below ? ' checked' : ''}>Show the floor below, faded</label>
    </section>`;
  body.querySelectorAll('[data-f]').forEach(b => b.addEventListener('click', () => {
    const above = b.dataset.f === 'above';
    const f = { id: uid(), name: above ? `Floor ${map.floors.length}` : (map.floors.some(x => x.name === 'Basement') ? `Basement ${map.floors.filter(x => x.name.startsWith('Basement')).length + 1}` : 'Basement') };
    mutate(() => { above ? map.floors.push(f) : map.floors.unshift(f); map.activeFloor = f.id; });
    selectedId = null; renderAll(); refreshSheet();
  }));
  body.querySelectorAll('[data-fname]').forEach(inp => inp.addEventListener('change', () => {
    const f = map.floors.find(x => x.id === inp.dataset.fname), v = inp.value.trim().slice(0, 30);
    if (f && v && v !== f.name) mutate(() => { f.name = v; }); else inp.value = f ? f.name : '';
  }));
  body.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => { switchFloor(b.dataset.go); refreshSheet(); }));
  body.querySelectorAll('[data-delfloor]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.delfloor, n = map.items.filter(it => it.floor === id).length;
    armButton(b, n ? `Delete + ${n} items?` : 'Delete?', () => {
      mutate(() => {
        const i = map.floors.findIndex(f => f.id === id);
        map.floors = map.floors.filter(f => f.id !== id);
        map.items = map.items.filter(it => it.floor !== id);
        if (map.activeFloor === id) map.activeFloor = map.floors[Math.max(0, i - 1)].id;
      });
      selectedId = null; renderAll(); refreshSheet();
    });
  }));
  body.querySelector('#f-below').addEventListener('change', e => { settings.below = e.target.checked; saveSettings(); requestDraw(); });
}

$('#edittypes').addEventListener('click', () => openPage('Bestiary', buildBestiary, 'editor'));

/* ---------- toolbar, keys, toast ---------- */
document.querySelectorAll('[data-tool]').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));
$('#snapbtn').addEventListener('click', () => { settings.snap = !settings.snap; saveSettings(); renderTools(); toast(settings.snap ? `Snap on: ${settings.step} m steps and ${settings.rotStep}° turns.` : 'Snap off: free placement.'); });
$('#fitbtn').addEventListener('click', fitView);
$('#lockmap').addEventListener('click', () => {
  map.locked = !map.locked; selectedId = null; tool = 'select'; livePre = null;
  markDirty(); renderAll();
  toast(map.locked ? 'Map locked. Nothing can be moved until you unlock it.' : 'Map unlocked.');
});
$('#undo').addEventListener('click', undo);
$('#redo').addEventListener('click', redo);
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea')) return;
  if (e.key === 'Escape') { if (sheetEl) closeSheet(); else if (pageBuild) closePage(); else if (!menuOpen()) { selectedId = null; setTool('select'); } return; }
  if (menuOpen() || sheetEl || pageBuild) return;
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
  else if ((e.key === 'Delete' || e.key === 'Backspace') && selected() && !selected().locked) { e.preventDefault(); const id = selectedId; mutate(() => { map.items = map.items.filter(i => i.id !== id); }); selectedId = null; renderAll(); }
});
let toastTimer = null, toastEl = null;
function toast(msg) {
  if (!toastEl) { toastEl = document.createElement('div'); toastEl.className = 'toast'; toastEl.setAttribute('role', 'status'); document.body.appendChild(toastEl); }
  toastEl.textContent = msg; toastEl.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { toastEl.hidden = true; }, 3600);
}

/* ---------- start ---------- */
readTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readTheme);
new MutationObserver(readTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(requestDraw);

(function boot() {
  Bestiary.load();
  const lastId = LS.get('mm2.current');
  let m = null;
  if (lastId) { try { m = normalize(Store.loadLocal(lastId)); } catch { m = null; } }
  openMap(m || sampleMap());
  if (m) setStatus('Saved on this device', 'ok');
  Store.init().then(async () => {
    if (!Store.cloud) return;
    Bestiary.sync();
    const list = await Store.listCloud();
    const newest = list.sort((a, b) => (b.updated || 0) - (a.updated || 0))[0];
    if (!edits && newest && (map.sample || (newest.updated || 0) > (map.updated || 0)) && newest.id !== map.id) {
      const cm = await Store.loadCloud(newest.id);
      if (cm && !edits) { try { openMap(normalize(cm)); return; } catch {} }
    }
    if (!map.sample && !list.some(e => e.id === map.id)) saveNow();
    else if (!map.sample) setStatus('Saved', 'ok');
  });
})();
})();
</script>
